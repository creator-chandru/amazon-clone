<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon.in</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo border">
                <div class="logo"></div>
            </div>


            <div class="nav-address border">
                <p class="address-first">Deliver To</p>
                <div class="address-icon">
                    <i class="fa-solid fa-location-dot"></i> 
                    <p class="address-sec">India</p>
                </div>
            </div>

            <div class="nav-search">
                <select class="search-select">
                    <option selected>All</option>
                </select>
                <input placeholder = "Search Amazon" class="search-input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="nav-signin border">
                <p><span class="line-one">Hello,sign in</span></p>
                <p><span class="line-two">Account & Lists</span></p><select></select>
            </div> 

            <div class="nav-order border">
                <p><span class="line-one">Returns</span></p>
                <p><span class="line-two">& Orders</span></p>
            </div>


            <div class="nav-cart border">
                <i class="fa-solid fa-cart-arrow-down"></i>
                Cart

            </div>
        </div>

        <div class="panel">
            <div class="panel-all">
                <i class="fa-solid fa-bars"></i>
                All
            </div>

            <div class="panel-options">
                <p>Today's Deals</p>
                <p>Prime Video</p>
                <p>Registry</p>
                <p>Gift Cards</p>
                <p>Customer Service</p>
                <p>Sell</p>
            </div>
        </div>
    </header>
    
</body>
</html>
